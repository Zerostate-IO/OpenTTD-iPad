name: Preview

on:
  pull_request:
    types: [labeled, synchronize]
    branches: [master, 'release/**']

# Untrusted half: contributor code runs here, so this workflow never has a
# write token or any secrets. `pull_request` gives fork PRs a read-only token
# and no secrets; the explicit permissions also cover same-repo PR branches,
# which would otherwise be write-capable.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    # Preserve the original `preview` label gate. `synchronize` stays safe:
    # a push after labelling only re-runs this read-only, secretless build.
    if: ${{ (github.event.action == 'labeled' && github.event.label.name == 'preview') || (github.event.action != 'labeled' && contains(github.event.pull_request.labels.*.name, 'preview')) }}
    name: Preview
    uses: ./.github/workflows/preview-build.yml
    # No secrets are declared or passed to the called workflow.
