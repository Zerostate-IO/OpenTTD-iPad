name: Preview build

on:
  workflow_call:

# Called only from the read-only `pull_request` workflow above. A called
# workflow cannot gain permissions the caller does not have; no secrets are
# declared, passed, or referenced here.
permissions:
  contents: read

jobs:
  preview:
    name: Build preview

    runs-on: ubuntu-latest
    container:
      # If you change this version, change the numbers in the cache step,
      # .github/workflows/ci-emscripten.yml (2x) and os/emscripten/Dockerfile too.
      image: emscripten/emsdk:3.1.57

    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        ref: ${{ github.event.pull_request.head.sha }}

    - name: Name branch
      run: |
        git config --global --add safe.directory ${GITHUB_WORKSPACE}
        git checkout -b pr${{ github.event.pull_request.number }}

    - name: Update to modern GCC
      run: |
        apt-get update
        apt-get install -y gcc-12 g++-12
        update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-12 100
        update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-12 100

    - name: Setup cache
      uses: actions/cache@v5
      with:
        path: /emsdk/upstream/emscripten/cache
        # If you change this version, change the numbers in the image configuration step,
        # .github/workflows/ci-emscripten.yml (2x) and os/emscripten/Dockerfile too.
        key: 3.1.57-${{ runner.os }}

    - name: Add liblzma support
      run: |
        cp ${GITHUB_WORKSPACE}/os/emscripten/ports/liblzma.py /emsdk/upstream/emscripten/tools/ports/contrib/

    - name: Build (host tools)
      run: |
        mkdir build-host
        cd build-host

        echo "::group::CMake"
        cmake .. -DOPTION_TOOLS_ONLY=ON
        echo "::endgroup::"

        echo "::group::Build"
        echo "Running on $(nproc) cores"
        make -j$(nproc) tools
        echo "::endgroup::"

    - name: Install GCC problem matcher
      uses: ammaraskar/gcc-problem-matcher@master

    - name: Build
      run: |
        mkdir build
        cd build

        echo "::group::CMake"
        emcmake cmake .. \
          -DHOST_BINARY_DIR=../build-host \
          -DCMAKE_BUILD_TYPE=Release \
          # EOF
        echo "::endgroup::"

        echo "::group::Build"
        echo "Running on $(nproc) cores"
        cmake --build . -j $(nproc) --target openttd
        echo "::endgroup::"

    - name: Prepare preview
      run: |
        mkdir public

        cp build/openttd.data public/
        cp build/openttd.html public/
        cp build/openttd.js public/
        cp build/openttd.wasm public/

        # Ensure we use the latest version of npm; the one we get with current
        # emscripten doesn't allow running "npx wrangler" as root.
        # Current emscripten can't install npm>=10.0.0 because node is too old.
        npm install -g npm@9

    # Write identity metadata in OUR step, after contributor code has run.
    # env: (not shell interpolation) keeps PR-controlled values inert.
    - name: Write preview metadata
      env:
        PREVIEW_PR_NUMBER: ${{ github.event.pull_request.number }}
        PREVIEW_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        PREVIEW_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
      run: |
        mkdir -p preview-meta
        {
          echo "pr_number=${PREVIEW_PR_NUMBER}"
          echo "head_sha=${PREVIEW_HEAD_SHA}"
          echo "head_repo=${PREVIEW_HEAD_REPO}"
        } > preview-meta/preview-meta.env

    - name: Upload preview build
      uses: actions/upload-artifact@v4
      with:
        name: preview-build
        path: |
          public/openttd.data
          public/openttd.html
          public/openttd.js
          public/openttd.wasm
        if-no-files-found: error

    - name: Upload preview metadata
      uses: actions/upload-artifact@v4
      with:
        name: preview-meta
        path: preview-meta/preview-meta.env
        if-no-files-found: error
